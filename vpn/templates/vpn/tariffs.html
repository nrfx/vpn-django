<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тарифы</title>
</head>
<body>
    <h1>Доступные тарифы</h1>
    <ul>
        {% for tariff in tariffs %}
            <li>{{ tariff.name }} — {{ tariff.price }} руб. ({{ tariff.duration_days }} дней)</li>
        {% endfor %}
    </ul>
</body>
</html>
